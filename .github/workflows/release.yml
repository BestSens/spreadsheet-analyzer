name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_type: Release
            artifact_name: spreadsheet_analyzer_Windows_x86_64.exe
            archive_suffix: windows-x86_64

          - os: ubuntu-latest
            build_type: Release
            artifact_name: spreadsheet_analyzer_Linux-x86_64
            archive_suffix: linux-x86_64

          - os: macos-latest
            build_type: Release
            artifact_name: spreadsheet_analyzer_macOS-ARM64.app
            archive_suffix: macos-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            zip \
            pkg-config \
            libgtk-3-dev \
            zlib1g-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libxext-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libpulse-dev

      - name: Set up Visual Studio
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Install LLVM and Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm ninja --yes
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Ninja Multi-Config" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }} --parallel ${{ env.NUMBER_OF_PROCESSORS }}

      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }} --parallel $(if [ "$RUNNER_OS" = "macOS" ]; then sysctl -n hw.ncpu; else nproc; fi)

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/package -Force | Out-Null
          Copy-Item "build/${{ matrix.build_type }}/${{ matrix.artifact_name }}" "build/package/"
          Copy-Item "LICENSE" "build/package/"
          $archiveName = "spreadsheet_analyzer_${{ github.ref_name }}_${{ matrix.archive_suffix }}.zip"
          Compress-Archive -Path "build/package/*" -DestinationPath "build/$archiveName" -Force

      - name: Package release archive (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p build/package
          cp -r build/${{ matrix.artifact_name }} build/package/
          cp LICENSE build/package/
          (cd build/package && zip -r "../spreadsheet_analyzer_${{ github.ref_name }}_${{ matrix.archive_suffix }}.zip" "${{ matrix.artifact_name }}" LICENSE)

      - name: Release ZIP archive
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ./build/spreadsheet_analyzer_${{ github.ref_name }}_${{ matrix.archive_suffix }}.zip
